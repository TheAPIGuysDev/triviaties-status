# Upptime heartbeat -> Sentry Cron. NOT generated by Upptime: its template
# update rewrites only its own eight workflow files, so this one survives.
#
# Why: from 2026-06-17 Uptime CI failed on every run, GitHub then disabled it
# for inactivity, and the public status page showed frozen all-green data for
# months with nobody told. A check inside Uptime CI cannot report that: it does
# not run when the workflow is failing at startup, held, or disabled.
#
# So Sentry expects a check-in about hourly (the */5 cron is throttled by
# GitHub to roughly hourly in practice). Each Uptime CI run reports ok or
# error; no runs at all means missed check-ins. Either alerts via the Sentry
# "Notify Brandon Rumiser" alert (email + Slack #infrastructure-monitoring).
#
# SENTRY_HEARTBEAT_URL is a repository variable holding the monitor's
# check-in URL. It carries the project's public DSN key, which is not secret.
name: Upptime heartbeat

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]

permissions: {}

jobs:
  checkin:
    name: Report to Sentry Cron
    runs-on: ubuntu-latest
    steps:
      - name: Check in
        env:
          URL: ${{ vars.SENTRY_HEARTBEAT_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::SENTRY_HEARTBEAT_URL is not set, so Sentry will report missed check-ins."
            exit 1
          fi
          case "$CONCLUSION" in
            success) status=ok ;;
            cancelled|skipped) echo "Uptime CI was $CONCLUSION; no check-in."; exit 0 ;;
            *) status=error ;;   # failure, timed_out, action_required, startup_failure
          esac
          curl -fsS --max-time 20 "${URL}?status=${status}"
          echo "Checked in: status=${status} (Uptime CI conclusion: ${CONCLUSION})"
