sites:
  - name: Triviaties Web
    url: https://triviaties.com/
  - name: Triviaties App
    url: https://app.triviaties.com/
  - name: Triviaties API (ping)
    url: https://api.triviaties.com/ping/
    expectedStatusCodes: [200]
  - name: Triviaties API (readiness)
    url: https://api.triviaties.com/healthz/
    expectedStatusCodes: [200]

status-website:
  cname: status.triviaties.com
  name: Triviaties Status
  introTitle: Triviaties system status
  introMessage: Real-time status of Triviaties services.
  customHeadHtml: |
    <script defer src="https://links.theapiguys.com/js/form_embed.js"></script>
    <script>
      (function injectStatusSubscribe() {
        function mount() {
          if (!document.body || document.getElementById('tt-status-subscribe')) return;
          var section = document.createElement('section');
          section.id = 'tt-status-subscribe';
          section.style.cssText = 'max-width:480px;margin:2rem auto 1rem;padding:0 1rem;';
          // No fixed height on the iframe wrapper or iframe itself —
          // HighLevel's form_embed.js measures the form's natural
          // content height (e.g. 565px) and resizes the iframe via
          // postMessage. A hard-coded height clips the form.
          section.innerHTML =
            '<h3 style="margin-top:0;">Get notified when something breaks</h3>' +
            '<p>Subscribe and we\'ll email you when an incident opens or resolves.</p>' +
            '<iframe ' +
              'src="https://links.theapiguys.com/widget/form/Z3XpIJyb1M5mpTIcT88j" ' +
              'style="width:100%;border:none;border-radius:4px;display:block;" ' +
              'id="inline-Z3XpIJyb1M5mpTIcT88j" ' +
              'data-layout="{\'id\':\'INLINE\'}" ' +
              'data-trigger-type="alwaysShow" data-trigger-value="" ' +
              'data-activation-type="alwaysActivated" data-activation-value="" ' +
              'data-deactivation-type="neverDeactivate" data-deactivation-value="" ' +
              'data-form-name="TriviaTies Status Updates" data-height="auto" ' +
              'data-layout-iframe-id="inline-Z3XpIJyb1M5mpTIcT88j" ' +
              'data-form-id="Z3XpIJyb1M5mpTIcT88j" ' +
              'title="Status update subscription"></iframe>';
          document.body.appendChild(section);

          var disclosure = document.createElement('p');
          disclosure.id = 'tt-status-cookies';
          disclosure.style.cssText = 'font-size:0.85rem;color:#666;text-align:center;padding:1rem 1rem 1.5rem;margin:0;';
          disclosure.innerHTML =
            'Functional cookies set by the subscription form are provided by HighLevel ' +
            'and are strictly necessary for form operation. See our ' +
            '<a href="https://triviaties.com/legal/privacy-policy">Privacy Policy</a> for details.';
          document.body.appendChild(disclosure);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mount);
        } else {
          mount();
        }
      })();
    </script>
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/TheAPIGuysDev/triviaties-status

assignees:
  - brumiser1550
