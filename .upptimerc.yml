status-website:
  cname: status.triviaties.com
  name: Triviaties Status
  introTitle: Triviaties system status
  introMessage: |
    Real-time status of Triviaties services.

    <h3 style="margin-top:1.5rem;">Get notified when something breaks</h3>
    <p>Subscribe and we'll email you when an incident opens or resolves.</p>
    <div style="max-width:480px;height:360px;margin:1rem 0;">
      <iframe
        src="https://links.theapiguys.com/widget/form/Z3XpIJyb1M5mpTIcT88j"
        style="width:100%;height:100%;border:none;border-radius:4px"
        id="inline-Z3XpIJyb1M5mpTIcT88j"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="TriviaTies Status Updates"
        data-height="auto"
        data-layout-iframe-id="inline-Z3XpIJyb1M5mpTIcT88j"
        data-form-id="Z3XpIJyb1M5mpTIcT88j"
        title="Status update subscription">
      </iframe>
    </div>
    <script src="https://links.theapiguys.com/js/form_embed.js"></script>
  customFooterHtml: |
    <p style="font-size:0.85rem;color:#666;text-align:center;padding:1rem 1rem 1.5rem;margin:0;">
      Functional cookies set by the subscription form are provided by HighLevel
      and are strictly necessary for form operation. See our
      <a href="https://triviaties.com/legal/privacy-policy">Privacy Policy</a>
      for details.
    </p>
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/TheAPIGuysDev/triviaties-status

